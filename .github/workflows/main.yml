name: Desktop app
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - name: Build the page and stage it for the shell
        run: |
          node build.js
          node tools/stage-app.js
      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm install
      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Atom Forge {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false
      - name: Keep the installers as a build artifact
        uses: actions/upload-artifact@v6
        with:
          name: atom-forge-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
