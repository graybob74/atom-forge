[package]
name = "atom-forge"
version = "0.35.0"
description = "Atom Forge — particles, atoms and molecules from real physics"
edition = "2021"
rust-version = "1.77"

[lib]
name = "atom_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
