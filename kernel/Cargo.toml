[package]
name = "atom-forge-kernel"
version = "0.36.0"
edition = "2021"
description = "Atom Forge's pair, bond and angle force kernels (engine.js PAIR KERNEL block) for WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
